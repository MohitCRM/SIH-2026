[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sih-scholarship-eligibility-checker"
version = "1.0.0"
description = "Standalone rules-based pre-matric ST scholarship eligibility screening API and Python library"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "pydantic>=2.6,<3",
    "python-dotenv>=1,<2",
]

[tool.setuptools.packages.find]
include = ["eligibility_checker*"]
